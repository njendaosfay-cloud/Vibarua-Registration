<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utengule–Itimba Estate | Labor Register</title>
<style>
  :root{
    --bark:#2b2118;
    --coffee:#4a3221;
    --coffee-light:#6b4a30;
    --parchment:#f6f1e6;
    --parchment-dark:#eee4cf;
    --leaf:#3f6b3f;
    --leaf-dark:#2c4d2c;
    --leaf-light:#e6f0e1;
    --cherry:#a5352c;
    --gold:#b8863b;
    --ink:#2a2420;
    --line:#d8cbb0;
    --white:#fffdf9;
    --shadow:0 2px 8px rgba(43,33,24,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Aptos Display','Aptos','Calibri','Segoe UI',Arial,sans-serif;
    background:
      radial-gradient(circle at 10% 10%, #f0e7d2 0%, transparent 45%),
      var(--parchment);
    color:var(--ink);
    min-height:100vh;
  }
  .app{max-width:1220px;margin:0 auto;padding:18px 18px 60px;}

  header.top{
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;
    padding:18px 22px;
    background:linear-gradient(135deg,var(--bark),var(--coffee));
    border-radius:14px;
    box-shadow:var(--shadow);
    color:var(--parchment);
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  header.top .brand{display:flex;align-items:center;gap:14px;}
  header.top .mark{
    width:46px;height:46px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #e7c07d, var(--gold) 60%, #7a531f 100%);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;flex:none;
    box-shadow:inset 0 0 0 2px rgba(0,0,0,0.15);
  }
  header.top h1{font-size:1.35rem;margin:0;letter-spacing:.3px;font-weight:700;}
  header.top .sub{font-size:.78rem;opacity:.8;margin-top:2px;letter-spacing:.5px;text-transform:uppercase;}
  header.top .stats{display:flex;gap:22px;font-size:.8rem;}
  header.top .stats b{display:block;font-size:1.15rem;color:#f0d9a8;}

  nav.tabs{
    display:flex;gap:6px;flex-wrap:wrap;
    margin-bottom:16px;
    border-bottom:2px solid var(--line);
    padding-bottom:0;
  }
  nav.tabs button{
    font-family:inherit;
    background:transparent;border:none;
    padding:10px 16px;font-size:.92rem;font-weight:600;
    color:#8a7860;cursor:pointer;
    border-bottom:3px solid transparent;
    transition:color .15s, border-color .15s;
    letter-spacing:.2px;
  }
  nav.tabs button:hover{color:var(--coffee);}
  nav.tabs button.active{color:var(--leaf-dark);border-bottom-color:var(--leaf);}

  .panel{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:var(--shadow);
    padding:22px;
    margin-bottom:18px;
  }
  .panel h2{margin-top:0;font-size:1.15rem;color:var(--coffee);border-bottom:1px solid var(--line);padding-bottom:10px;}
  .panel .hint{font-size:.82rem;color:#8a7860;margin-top:-6px;margin-bottom:16px;}

  /* ---- Register form ---- */
  .reg-grid{display:grid;grid-template-columns:180px 1fr;gap:14px 18px;align-items:start;max-width:640px;}
  .reg-grid label{font-weight:700;color:var(--coffee);padding-top:9px;}
  .field-input, select, input[type=date], input[type=text], input[type=number]{
    font-family:inherit;font-size:.95rem;
    padding:8px 10px;border:1.5px solid var(--line);border-radius:7px;
    background:var(--parchment);color:var(--ink);width:100%;
  }
  .field-input:focus, select:focus, input:focus{outline:2px solid var(--leaf);outline-offset:1px;border-color:var(--leaf);}
  .day-display{
    padding:8px 10px;border-radius:7px;background:var(--leaf-light);
    color:var(--leaf-dark);font-weight:700;display:inline-block;min-width:130px;
  }
  .salary-options{display:flex;flex-wrap:wrap;gap:10px;}
  .salary-options label{
    font-weight:600;color:var(--ink);padding:6px 12px;border:1.5px solid var(--line);
    border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:6px;background:var(--parchment);
  }
  .salary-options input{width:auto;accent-color:var(--leaf);}
  .salary-options label.checked{background:var(--leaf-light);border-color:var(--leaf);color:var(--leaf-dark);}
  .worker-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--leaf-light);color:var(--leaf-dark);font-weight:700;font-size:.82rem;
    padding:5px 6px 5px 12px;border-radius:16px;border:1px solid #bcd8bc;
  }
  .chip-remove{
    background:none;border:none;cursor:pointer;color:var(--cherry);font-weight:800;
    font-size:1rem;line-height:1;padding:2px 6px;border-radius:50%;
  }
  .chip-remove:hover{background:rgba(165,53,44,0.12);}
  .chip-empty{color:#8a7860;font-size:.8rem;font-style:italic;}
  .plot-checklist{
    border:1.5px solid var(--line);border-radius:7px;background:var(--parchment);
    max-height:220px;overflow-y:auto;padding:8px;
    display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;
  }
  .plot-checklist label{
    display:flex;align-items:center;gap:6px;font-weight:500;color:var(--ink);
    font-size:.85rem;padding:3px 4px;border-radius:4px;cursor:pointer;
  }
  .plot-checklist label:hover{background:var(--leaf-light);}
  .plot-checklist input[type=checkbox]{width:auto;accent-color:var(--leaf);}
  .plot-filter{margin-bottom:8px;}
  .plot-selected-count{font-size:.78rem;color:var(--leaf-dark);font-weight:700;margin-top:6px;}
  .btn-row{display:flex;gap:10px;margin-top:20px;}
  button.primary{
    font-family:inherit;font-weight:700;font-size:.95rem;cursor:pointer;
    background:linear-gradient(135deg,var(--leaf),var(--leaf-dark));color:#fff;
    border:none;padding:11px 22px;border-radius:8px;box-shadow:var(--shadow);
  }
  button.primary:hover{filter:brightness(1.08);}
  button.secondary{
    font-family:inherit;font-weight:700;font-size:.95rem;cursor:pointer;
    background:var(--white);color:var(--coffee);border:1.5px solid var(--coffee-light);
    padding:11px 22px;border-radius:8px;
  }
  button.secondary:hover{background:var(--parchment-dark);}
  .msg{margin-top:12px;font-weight:700;font-size:.88rem;}
  .msg.ok{color:var(--leaf-dark);}
  .msg.err{color:var(--cherry);}

  /* ---- tables ---- */
  .table-wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px;}
  table{border-collapse:collapse;width:100%;font-size:.82rem;}
  th,td{padding:6px 9px;border:1px solid var(--line);text-align:center;white-space:nowrap;}
  thead th{
    position:sticky;top:0;background:var(--coffee);color:var(--parchment);
    z-index:2;font-weight:700;
  }
  tbody tr:nth-child(even){background:#faf6ec;}
  tbody tr:hover{background:var(--leaf-light);}
  td.name-cell, th.name-cell{
    position:sticky;left:0;background:var(--white);z-index:1;
    text-align:left;font-weight:700;color:var(--coffee);min-width:170px;
  }
  thead th.name-cell{background:var(--coffee);color:var(--parchment);z-index:3;}
  tbody tr:nth-child(even) td.name-cell{background:#faf6ec;}
  td.amt{color:var(--leaf-dark);font-weight:700;background:#eef6ea;}
  td.blank{color:#c9bfa9;}
  td.off{background:#f8dede;}
  th.off{background:var(--cherry) !important;}
  td.holiday, th.holiday, td.name-cell.holiday{background:#e6d9f5 !important;color:#4a2c78;}
  th.holiday{background:#6d3fa6 !important;color:#fff !important;}
  td.total{background:var(--gold);color:#3a2a08;font-weight:800;}
  th.total-h{background:var(--leaf-dark) !important;}
  td.sig{background:#fbf3da;min-width:90px;}

  .legend-off{background:#f8dede;color:var(--cherry);padding:1px 6px;border-radius:4px;font-weight:700;}
  .legend-holiday{background:#e6d9f5;color:#4a2c78;padding:1px 6px;border-radius:4px;font-weight:700;}

  .toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  .toolbar label{font-weight:700;color:var(--coffee);font-size:.85rem;}
  .toolbar select, .toolbar input{width:auto;}
  .range-toolbar{background:var(--parchment-dark);padding:10px 14px;border-radius:8px;}
  .search-box{max-width:260px;}
  .badge{
    display:inline-block;background:var(--leaf-light);color:var(--leaf-dark);
    padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:700;
  }

  /* ---- voucher / contract (teal ledger style) ---- */
  .voucher{
    --teal:#0e8f86;
    border:2.5px solid var(--teal);border-radius:2px;padding:0;max-width:560px;margin:0 auto;
    font-family:'Aptos Display','Aptos','Calibri','Segoe UI',Arial,sans-serif;color:#123;background:#fff;
  }
  .voucher .v-topbar{
    display:flex;justify-content:space-between;align-items:center;
    border-bottom:2px solid var(--teal);padding:6px 10px;
  }
  .voucher .v-tag{font-size:.72rem;font-weight:800;letter-spacing:1px;color:var(--teal);}
  .voucher .v-boxes{display:flex;gap:6px;}
  .voucher .v-box{
    border:1.5px solid var(--teal);border-radius:2px;padding:3px 8px;font-size:.62rem;
    font-weight:700;color:var(--teal);text-align:center;min-width:80px;
  }
  .voucher .v-box b{display:block;font-size:.8rem;color:#123;margin-top:2px;}
  .voucher .v-head{
    text-align:center;padding:10px;font-weight:800;letter-spacing:1.5px;font-size:1.15rem;
    color:#123;border-bottom:2px solid var(--teal);
  }
  .v-row{display:grid;grid-template-columns:170px 1fr;border-bottom:1px solid var(--teal);}
  .v-row > div{padding:7px 12px;font-size:.88rem;}
  .v-row .k{font-weight:700;color:#123;}
  .v-row .v{color:#0b3d91;font-weight:600;}
  .v-work{
    text-align:center;font-weight:800;color:#0d6e14;
    padding:8px;border-bottom:2px solid var(--teal);letter-spacing:.5px;font-size:.95rem;
  }
  .v-row-2{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--teal);}
  .v-row-2 > div{padding:7px 10px;border-right:1px solid var(--teal);font-size:.82rem;}
  .v-row-2 > div:last-child{border-right:none;}
  .v-row-2 .k{display:block;font-weight:700;color:#123;font-size:.72rem;text-transform:uppercase;letter-spacing:.4px;}
  .v-row-2 .v{display:block;color:#0b3d91;font-weight:700;margin-top:2px;min-height:1.1em;}
  .v-receipt{border-top:2px solid var(--teal);}
  .v-receipt-title{
    text-align:center;font-weight:800;padding:7px;background:#eafaf8;color:var(--teal);
    letter-spacing:.4px;font-size:.85rem;border-bottom:1px solid var(--teal);
  }
  .v-approve{
    padding:7px 10px;color:#a5352c;font-weight:800;font-size:.78rem;
    display:flex;align-items:center;letter-spacing:.3px;
  }


  /* ---- multi-select dropdowns ---- */
  .msel-trigger{
    width:100%;display:flex;justify-content:space-between;align-items:center;
    font-family:inherit;font-size:.95rem;font-weight:600;text-align:left;cursor:pointer;
    padding:9px 12px;border:1.5px solid var(--line);border-radius:7px;background:var(--parchment);color:var(--ink);
  }
  .msel-trigger:hover{border-color:var(--leaf);}
  .msel-panel{display:none;border:1.5px solid var(--leaf);border-radius:7px;background:var(--white);padding:8px;margin-top:6px;box-shadow:var(--shadow);}
  .msel-panel.open{display:block;}
  .msel-list{
    max-height:230px;overflow-y:auto;margin:8px 0;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;align-content:start;
  }
  .msel-list label{display:flex;align-items:center;gap:6px;font-weight:500;color:var(--ink);font-size:.85rem;padding:4px;border-radius:4px;cursor:pointer;}
  .msel-list label:hover{background:var(--leaf-light);}
  .msel-list input[type=checkbox]{width:auto;accent-color:var(--leaf);}
  .msel-addnew{
    grid-column:1 / -1;font-family:inherit;font-weight:700;cursor:pointer;text-align:left;
    background:var(--leaf-light);color:var(--leaf-dark);border:1.5px dashed var(--leaf);border-radius:6px;padding:7px 10px;
  }
  .msel-actions{display:flex;justify-content:space-between;gap:8px;}
  .msel-actions button{padding:6px 14px;font-size:.82rem;}
  .scan-box{margin-top:10px;}
  .scan-panel{display:none;margin-top:8px;}
  .scan-panel.open{display:block;}
  .scan-panel video{width:100%;max-width:340px;border-radius:8px;background:#000;display:block;margin-bottom:8px;}
  .scan-panel .field-input{margin-top:8px;}

  /* ---- worker ID cards (credit-card size 85.6 x 54 mm) ---- */
  .id-grid{display:grid;grid-template-columns:repeat(2,85.6mm);gap:1mm;justify-content:center;}
  .id-card{
    width:85.6mm;height:54mm;border:0.3mm solid #4a3221;border-radius:2.5mm;overflow:hidden;background:#fff;color:#1b1b1b;
    display:flex;flex-direction:column;box-sizing:border-box;
  }
  .idc-head{background:#4a3221;color:#fff;padding:1.6mm 3mm;line-height:1.15;}
  .idc-head b{display:block;font-size:10.5pt;letter-spacing:.4pt;}
  .idc-head span{display:block;font-size:6pt;letter-spacing:.5pt;color:#f0d9a8;}
  .idc-body{flex:1;display:flex;align-items:center;gap:2.5mm;padding:2mm 3mm;}
  .idc-photo{flex:none;width:20mm;height:25mm;border:0.3mm dashed #888;display:flex;align-items:center;justify-content:center;font-size:6pt;color:#999;letter-spacing:1px;}
  .idc-info{flex:1;min-width:0;}
  .idc-name{font-weight:800;font-size:11pt;line-height:1.15;word-break:break-word;}
  .idc-id{font-weight:900;font-size:17pt;letter-spacing:1pt;color:#2c4d2c;margin-top:1.2mm;}
  .idc-sub{font-size:6.5pt;color:#6b4a30;font-weight:700;text-transform:uppercase;letter-spacing:.5pt;}
  .idc-qr{flex:none;width:23mm;height:23mm;}
  .idc-qr svg{width:100%;height:100%;display:block;}
  .idc-foot{background:#e6f0e1;color:#2c4d2c;font-size:5.8pt;font-weight:700;text-align:center;padding:1mm;letter-spacing:.3pt;}
  .scan-instant{display:flex;gap:8px;align-items:flex-start;font-size:.85rem;color:var(--coffee);padding:8px;background:var(--leaf-light);border-radius:6px;}
  .scan-instant input{width:auto;margin-top:3px;accent-color:var(--leaf);}
  .scan-log-head{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:.85rem;color:var(--leaf-dark);}
  .scan-log-head button{padding:4px 10px;font-size:.75rem;}
  .scan-log-list{max-height:140px;overflow:auto;font-size:.82rem;border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-top:6px;background:var(--parchment);}
  @media print{
    .print-sheet.id-sheet{padding:0;}
    .print-sheet .id-grid{width:100%;grid-template-columns:repeat(2,85.6mm);gap:1mm;}
  }

  /* ---- QR stickers (63.5 x 33.9 mm, 3 x 8 per A4) ---- */
  .sticker-grid{display:grid;grid-template-columns:repeat(3,63.5mm);gap:0;justify-content:center;}
  .qr-sticker{width:63.5mm;height:33.9mm;box-sizing:border-box;border:0.2mm dashed #999;display:flex;align-items:center;gap:3mm;padding:2.5mm;background:#fff;color:#000;overflow:hidden;}
  .qr-sticker .qs-q{flex:none;width:26mm;height:26mm;}
  .qr-sticker .qs-q svg{width:100%;height:100%;display:block;}
  .qr-sticker .qs-t b{display:block;font-size:16pt;font-weight:900;letter-spacing:1pt;}
  .qr-sticker .qs-t span{display:block;font-size:8.5pt;font-weight:700;line-height:1.2;word-break:break-word;}
  @media print{
    .print-sheet.sticker-sheet{padding:0;}
    .print-sheet .sticker-grid{width:100%;grid-template-columns:repeat(3,63.5mm);}
  }

  .empty-state{padding:40px;text-align:center;color:#8a7860;}
  .empty-state .big{font-size:2.4rem;}

  #print-all-vouchers{display:none;}
  /* three vouchers per printed sheet: group in .print-sheet, break after each group */
  .print-sheet{padding:4mm 0;}
  .print-sheet .voucher{margin-bottom:5mm;}
  .print-sheet .voucher:last-child{margin-bottom:0;}

  @media print{
    @page{ size:A4; margin:8mm; }
    nav.tabs, header.top, .toolbar, .no-print{display:none !important;}
    .panel{box-shadow:none;border:none;padding:0;}
    body{background:#fff;}
    body.printing-all > .app{display:none !important;}
    body.printing-all #print-all-vouchers{display:block !important;}
    .print-sheet{page-break-after:always;}
    .print-sheet:last-child{page-break-after:auto;}
    .voucher{font-size:8.2px;max-width:100%;}
    .voucher .v-topbar{padding:3px 8px;}
    .voucher .v-tag{font-size:7px;}
    .voucher .v-box{padding:2px 6px;font-size:6.5px;min-width:60px;}
    .voucher .v-box b{font-size:8px;}
    .voucher .v-head{font-size:11px;padding:5px;}
    .v-row > div{padding:3px 8px;font-size:8.5px;}
    .v-work{font-size:9px;padding:5px;}
    .v-row-2 > div{padding:3px 8px;font-size:8px;}
    .v-row-2 .k{font-size:6.5px;}
    .v-row-2 .v{font-size:8.5px;margin-top:1px;}
    .v-receipt-title{font-size:7.5px;padding:3px;}
    .v-approve{font-size:7px;padding:3px 8px;}
  }
  @media (max-width:640px){
    .reg-grid{grid-template-columns:1fr;}
    .reg-grid label{padding-top:0;}
    header.top{flex-direction:column;align-items:flex-start;}
  }
</style>
</head>

<div class="app" id="app"></div>

				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;

};

function qrMatrix(text){
  const bytes = unescape(encodeURIComponent(text));
  const q = new (__qrreq('index'))(-1, 0);
  q.addData(bytes); q.make();
  return q.modules;
}
function qrSVG(text){
  const m = qrMatrix(text), n = m.length;
  let d='';
  for(let y=0;y<n;y++){let x=0;while(x<n){if(m[y][x]){let s=x;while(x<n&&m[y][x])x++;d+='M'+s+' '+y+'h'+(x-s)+'v1h-'+(x-s)+'z';}else x++;}}
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 '+(n+4)+' '+(n+4)+'" shape-rendering="crispEdges"><rect x="-2" y="-2" width="'+(n+4)+'" height="'+(n+4)+'" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>';
}

const STORE_KEY = 'utengule-itimba-labor-log';
const WORKERS_STORE_KEY = 'utengule-itimba-extra-workers';
let records = [];
// every worker has an ID: [id, name] pairs from the master list, plus any added later
let ALL_WORKERS = WORKERS.map(w=>({id:w[0], name:w[1]}));
let storageReady = false;
const BUILTIN_IDS = new Set(WORKERS.map(w=>w[0]));


// tiny wrapper so the rest of the app can keep using get/set with the same shape
// it used with window.storage -- but backed by localStorage, which needs no
// network connection and works when this file is opened directly in a browser.
const localStore = {
  get(key){
    try{
      const raw = localStorage.getItem(key);
      return raw==null ? null : {key, value: raw};
    }catch(e){ return null; }
  },
  set(key, value){
    try{ localStorage.setItem(key, value); return {key, value}; }
    catch(e){ return null; }
  }
};

async function loadRecords(){
  try{
    const res = localStore.get(STORE_KEY);
    if(res && res.value){
      records = JSON.parse(res.value);
    } else {
      records = SEED_RECORDS.slice();
      localStore.set(STORE_KEY, JSON.stringify(records));
    }
  }catch(e){
    records = SEED_RECORDS.slice();
    try{ localStore.set(STORE_KEY, JSON.stringify(records)); }catch(e2){}
  }
  storageReady = true;
}


const normName = n => String(n||'').replace(/\s+/g,' ').trim();
function workerById(id){ return ALL_WORKERS.find(w=>w.id===id); }
function workersByName(name){ const k = normName(name).toLowerCase(); return ALL_WORKERS.filter(w=>w.name.toLowerCase()===k); }
function nextWorkerId(name){
  const L = /[A-Za-z]/.test(normName(name)[0]||'') ? normName(name)[0].toUpperCase() : 'X';
  let mx = 0;
  ALL_WORKERS.forEach(w=>{ if(w.id[0]===L){ const n = parseInt(w.id.slice(2),10); if(n>mx) mx = n; } });
  return `${L}-${String(mx+1).padStart(3,'0')}`;
}
function persistExtraWorkers(){
  try{
    const extra = ALL_WORKERS.filter(w=>!BUILTIN_IDS.has(w.id));
    localStore.set(WORKERS_STORE_KEY, JSON.stringify(extra));
  }catch(e){}
}
function addWorkerToDb(name, phone){
  const clean = normName(name);
  const w = { id: nextWorkerId(clean), name: clean };
  if(phone && String(phone).trim()) w.phone = String(phone).trim();
  ALL_WORKERS.push(w);
  persistExtraWorkers();
  return w;
}
async function loadExtraWorkers(){
  try{
    const res = localStore.get(WORKERS_STORE_KEY);
    if(res && res.value){
      JSON.parse(res.value).forEach(w=>{ if(w && w.id && w.name && !workerById(w.id)) ALL_WORKERS.push(w.phone?{id:w.id, name:w.name, phone:w.phone}:{id:w.id, name:w.name}); });
    }
  }catch(e){}
  // older records saved before IDs existed: attach the matching ID
  let changed = false;
  records.forEach(r=>{
    if(!r.wid){ const m = workersByName(r.name); if(m.length){ r.wid = m[0].id; changed = true; } }
  });
  if(changed) await saveRecords();
}

}

function fmt(n){ return n==null ? '' : n.toLocaleString('en-US'); }
function dayName(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('en-US', {weekday:'long'});
}
function isSunday(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.getDay() === 0;
}
// Fixed-date Tanzanian public holidays (movable holidays e.g. Eid/Easter are not included
// since they change every year and aren't computable from a fixed rule).
const TZ_PUBLIC_HOLIDAYS = {
  '01-01': "New Year's Day",
  '01-12': 'Zanzibar Revolution Day',
  '04-07': 'Karume Day',
  '04-26': 'Union Day',
  '05-01': "Workers' Day",
  '07-07': 'Saba Saba',
  '08-08': 'Nane Nane',
  '10-14': 'Nyerere Day',
  '12-09': 'Independence Day',
  '12-25': 'Christmas Day',
  '12-26': 'Boxing Day',
};
function publicHolidayName(dateStr){
  if(!dateStr) return '';
  return TZ_PUBLIC_HOLIDAYS[dateStr.slice(5,10)] || '';
}
function isPublicHoliday(dateStr){ return !!publicHolidayName(dateStr); }
function dayClass(dateStr){
  if(isPublicHoliday(dateStr)) return 'holiday';
  if(isSunday(dateStr)) return 'off';
  return '';
}
function monthKey(dateStr){ return dateStr ? dateStr.slice(0,7) : ''; }
function daysInMonth(ym){
  const [y,m] = ym.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}
function uniqueSorted(arr){ return Array.from(new Set(arr)).sort(); }
function monthLabel(ym){
  const [y,m] = ym.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString('en-US',{month:'long', year:'numeric'});
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function shortDate(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('en-US',{day:'numeric', month:'short'});
}
function niceDate(dateStr){
  if(!dateStr) return '&mdash;';
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('en-GB',{day:'2-digit', month:'short', year:'numeric'}).replace(/ /g,'-');
}
function dateRangeArray(start, end){
  const out = [];
  if(!start || !end) return out;
  let d = new Date(start+'T00:00:00');
  const last = new Date(end+'T00:00:00');
  while(d<=last){
    out.push(d.toISOString().slice(0,10));
    d.setDate(d.getDate()+1);
  }
  return out;
}
function allDataDates(){
  return uniqueSorted(records.map(r=>r.date)).filter(Boolean).sort();
}
function recordsInRange(start, end){
  return records.filter(r=> r.date && (!start || r.date>=start) && (!end || r.date<=end));

function escCsv(v){
  if(v==null) return '';
  const s = String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function downloadCsv(filename, rows){
  const csv = rows.map(r=>r.map(escCsv).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

// Task & Plot breakdown for a date range -- the single source of truth used by
// both the Task Summary breakdown table and the Contract/Voucher tab.
function taskBreakdown(start, end){
  const recs = recordsInRange(start, end);
  const tasksUsed = uniqueSorted(recs.map(r=>r.task)).sort((a,b)=>a.localeCompare(b));
  return tasksUsed.map(t=>{
    const trecs = recs.filter(r=>r.task===t);
    const plots = uniqueSorted(trecs.flatMap(r=>(r.plots||'').split(',').map(p=>p.trim()).filter(Boolean)));
    const dates = uniqueSorted(trecs.map(r=>r.date)).sort();
    const mandays = trecs.length;
    const amt = trecs.reduce((s,r)=>s+Number(r.salary||0),0);
    const rateCounts = {};
    trecs.forEach(r=>{ rateCounts[r.salary] = (rateCounts[r.salary]||0)+1; });
    const rateEntry = Object.entries(rateCounts).sort((a,b)=>b[1]-a[1])[0];
    const rateLabel = rateEntry ? `${fmt(Number(rateEntry[0]))}/= per manrate` : '&mdash;';
    return {
      task: t, plots, mandays, amt, rateLabel,
      start: dates[0] || start, end: dates[dates.length-1] || end,
    };
  });
}

// ---------- QR badge scanning ----------
const BADGE_PREFIX = 'UTW:';
let scanStream = null, scanTimer = null, lastScan = {v:'', t:0};
function badgePayload(w){ return BADGE_PREFIX + w.id; }
function parseBadge(text){
  let t = String(text||'').trim();
  if(t.toUpperCase().startsWith(BADGE_PREFIX)) t = t.slice(BADGE_PREFIX.length);
  return t.trim();
}
// accepts a badge ID (A-001), "UTW:A-001", or a plain name
function resolveWorker(raw){
  const code = parseBadge(raw);
  if(!code) return null;
  if(/^[A-Za-z]-\d{3,}$/.test(code)){
    const w = workerById(code.toUpperCase());
    return w ? { w, isNew:false } : { error: `ID ${code.toUpperCase()} is not in the database.` };
  }
  const m = workersByName(code);
  if(m.length>1) return { error: `${normName(code)} matches ${m.length} workers (${m.map(x=>x.id).join(', ')}) \u2014 scan the card or type the ID.` };
  if(m.length===1) return { w:m[0], isNew:false };
  return { w: addWorkerToDb(code), isNew:true };
}
function addWorkerByCode(raw){
  const r = resolveWorker(raw);
  if(!r || r.error) return r;
  const dup = state.form.workers.includes(r.w.id);
  if(!dup) state.form.workers = state.form.workers.concat([r.w.id]);
  return { name:r.w.name, id:r.w.id, dup, isNew:r.isNew };
}
// Scan Entry mode: every scan is saved as a finished record straight away
function registerScan(raw){
  const r = resolveWorker(raw);
  if(!r || r.error) return r;
  const f = state.form;
  if(!f.date || !f.task.trim() || !f.plots.length) return { error:'Choose the Date, Task and at least one Plot first, then scan.' };
  const exists = records.find(x=>x.wid===r.w.id && x.date===f.date && x.task===f.task.trim());
  if(exists) return { name:r.w.name, id:r.w.id, dup:true, instant:true };
  const rec = {
    id: records.reduce((m,x)=>Math.max(m,x.id||0),0)+1,
    wid:r.w.id, name:r.w.name, date:f.date, day:dayName(f.date),
    salary:Number(f.salary), task:f.task.trim(), plots:f.plots.join(', '),
  };
  records.push(rec);
  saveRecords();
  state.scanLog.unshift({ rid:rec.id, id:r.w.id, name:r.w.name });
  return { name:r.w.name, id:r.w.id, dup:false, isNew:r.isNew, instant:true };
}

  if(!state.scanLog.length) return '';
  return `<div class="scan-log-head"><b>${state.scanLog.length} registered this session</b>
      <span><button type="button" class="secondary" id="btn-scan-undo">Undo last</button></span></div>
    <div class="scan-log-list">${state.scanLog.map(x=>`<div>${escHtml(x.id)} &middot; ${escHtml(x.name)}</div>`).join('')}</div>`;
}

}
function handleScan(raw){

}
function scanFeedback(res){
  const st = document.getElementById('scan-status');
  if(!st) return;
  if(!res || res.error){ st.className = 'msg err'; st.textContent = res ? res.error : 'Could not read that code.'; return; }
  if(res.instant){
    refreshScanLog();
    st.className = res.dup ? 'msg err' : 'msg ok';
    st.textContent = res.dup
      ? `${res.name} (${res.id}) is already registered for this task today.`
      : `Registered ${res.name} (${res.id})${res.isNew?' \u2014 new worker':''} \u2014 ${state.scanLog.length} this session.`;
  } else {
    msRefreshList('workers'); msRefreshSummary('workers');
    const n = state.form.workers.length;
    st.className = res.dup ? 'msg err' : 'msg ok';
    st.textContent = res.dup
      ? `${res.name} (${res.id}) is already in the list \u2014 ${n} selected.`
      : `Added ${res.name} (${res.id})${res.isNew?' \u2014 new worker':''} \u2014 ${n} selected.`;
  }
  try{ if(navigator.vibrate) navigator.vibrate(res.dup?[60,40,60]:80); }catch(e){}
}
async function startScan(){
  const st = document.getElementById('scan-status');
  const video = document.getElementById('scan-video');
  if(!('BarcodeDetector' in window)){
    st.className = 'msg err';
    st.textContent = 'This browser cannot read QR codes with the camera. Use Chrome or Edge (Android or PC), or type/scan the code in the box below.';
    return;
  }
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } });
  }catch(e){
    st.className = 'msg err';
    st.textContent = 'Camera access was blocked. Allow the camera for this page, or type the code in the box below.';
    return;
  }
  video.srcObject = scanStream;
  try{ await video.play(); }catch(e){}
  st.className = 'msg'; st.textContent = 'Point the camera at a worker badge.';
  const det = new BarcodeDetector({ formats:['qr_code'] });
  scanTimer = setInterval(async ()=>{
    try{
      const codes = await det.detect(video);
      if(!codes.length) return;
      const v = codes[0].rawValue, now = Date.now();
      if(v === lastScan.v && now - lastScan.t < 2500) return;
      lastScan = { v, t: now };
      scanFeedback(handleScan(v));
    }catch(e){}
  }, 300);
}
function stopScan(){
  if(scanTimer){ clearInterval(scanTimer); scanTimer = null; }
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream = null; }
}

function downloadQrPng(w){
  const m = qrMatrix(badgePayload(w)), n = m.length, px = 20, pad = 2, size = (n+pad*2)*px;
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,size,size); g.fillStyle = '#000';
  for(let y=0;y<n;y++) for(let x=0;x<n;x++) if(m[y][x]) g.fillRect((x+pad)*px,(y+pad)*px,px,px);
  c.toBlob(b=>downloadFile(`${w.id}-QR.png`, b), 'image/png');
}

async function importBackupFile(file){
  const data = JSON.parse(await file.text());
  const incoming = Array.isArray(data.records) ? data.records : [];
  // map workers created on the other device onto this device's IDs
  const idMap = {};
  let addedWorkers = 0;
  (Array.isArray(data.extraWorkers) ? data.extraWorkers : []).forEach(w=>{
    if(!w || !w.id || !w.name) return;
    const same = workerById(w.id);
    if(same && same.name.toLowerCase()===w.name.toLowerCase()){ idMap[w.id] = same.id; return; }
    const byName = workersByName(w.name);
    if(byName.length){ idMap[w.id] = byName[0].id; return; }
    if(same){ const nw = addWorkerToDb(w.name); idMap[w.id] = nw.id; addedWorkers++; return; }
    ALL_WORKERS.push(w.phone?{id:w.id, name:normName(w.name), phone:w.phone}:{id:w.id, name:normName(w.name)}); idMap[w.id] = w.id; addedWorkers++;
  });
  persistExtraWorkers();
  const keyOf = r=>`${r.wid||r.name}|${r.date}|${r.task}|${r.plots}|${r.salary}`;
  const existingKeys = new Set(records.map(keyOf));
  let added = 0;
  let maxId = records.reduce((m,r)=>Math.max(m,r.id||0),0);
  incoming.forEach(r0=>{
    const r = {...r0};
    if(r.wid && idMap[r.wid]) r.wid = idMap[r.wid];
    const w = r.wid ? workerById(r.wid) : (workersByName(r.name)[0]);
    if(w){ r.wid = w.id; r.name = w.name; }
    const key = keyOf(r);
    if(!existingKeys.has(key)){ maxId += 1; records.push({...r, id:maxId}); existingKeys.add(key); added += 1; }
  });
  await saveRecords();
  return { added, addedWorkers };
}

  const recs = recordsInRange(start, end);

  // date -> task -> {workers, amount}
  const grid = {};
  dateList.forEach(iso=> grid[iso] = {});

  const grandWorkers = recs.length;
  const grandAmt = recs.reduce((s,r)=>s+Number(r.salary||0),0);

  let head = `<th>Date</th>` + tasksUsed.map(t=>`<th title="Plots: ${taskTotals[t].plots.join(', ')||'&mdash;'}">${t}</th>`).join('') + `<th class="total-h">Day Workers</th>`;
  let body = '';
  dateList.forEach(iso=>{
    let rowWorkers = 0;
    const cells = tasksUsed.map(t=>{
      const cell = grid[iso][t];
      if(cell && cell.workers){ rowWorkers += cell.workers; return `<td class="amt">${cell.workers}</td>`; }
      return `<td class="blank">&ndash;</td>`;
    }).join('');
    if(rowWorkers===0) return;
    const cls = dayClass(iso);
    body += `<tr><td class="name-cell ${cls}">${iso}${isPublicHoliday(iso)?` &mdash; ${publicHolidayName(iso)}`:''}</td>${cells}<td class="total">${rowWorkers}</td></tr>`;
  });
  const workersRow = `<tr><td class="name-cell">Total Workers</td>${tasksUsed.map(t=>`<td class="total">${taskTotals[t].mandays}</td>`).join('')}<td class="total">${grandWorkers}</td></tr>`;
  const amtRow = `<tr><td class="name-cell">Total Amount</td>${tasksUsed.map(t=>`<td class="amt">${fmt(taskTotals[t].amt)}</td>`).join('')}<td class="total">${fmt(grandAmt)}</td></tr>`;

  const plotRows = tasksUsed.map(t=>`
    <tr>
      <td class="name-cell">${t}</td>
      <td style="text-align:left;">${taskTotals[t].plots.join(', ') || '&mdash;'}</td>
      <td class="total">${taskTotals[t].mandays}</td>
      <td class="amt">${fmt(taskTotals[t].amt)}</td>
    </tr>`).join('');

  return `
  <div class="panel">
    <h2>Task Summary</h2>
    <div class="hint">Every task performed from ${niceDate(start)} to ${niceDate(end)}, by date, counted by number of workers &mdash; mirrors the Pruning / Weeding / Herbicide / Fertilization / Pests sheet, one column per actual task. Hover a task header to see its plots. <span class="legend-off">Sundays</span> and <span class="legend-holiday">public holidays</span> are shaded on the date column.</div>
    ${rangeControls('task')}
    <div class="toolbar">
      <span class="badge">${tasksUsed.length} tasks</span>
      <span class="badge">${grandWorkers} total workers</span>
      <span class="badge">Total spend: ${fmt(grandAmt)} TZS</span>
      <button class="secondary no-print" id="btn-print-tasks" style="margin-left:auto;">Print</button>
    </div>
    <div class="table-wrap">
      <table><thead><tr>${head}</tr></thead><tbody>${body}${workersRow}${amtRow}</tbody></table>
    </div>
  </div>

  <div class="panel">
    <h2>Task &amp; Plot Breakdown</h2>
    <div class="hint">Which plots each task was carried out on in this period, with total workers and cost &mdash; this exact table is what feeds the Contract/Voucher tab.</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th class="name-cell">Task</th><th>Plots Worked</th><th>Total Workers</th><th>Total Amount</th></tr></thead>
        <tbody>${plotRows || `<tr><td colspan="4" class="empty-state">No entries.</td></tr>`}</tbody>
      </table>
    </div>
  </div>
  `;
}

// ---- Contract / Voucher tab (screenshot 4 style) ----
function voucherBlockHTML(entry, contractor){
  const estDays = (entry.start && entry.end)
    ? Math.round((new Date(entry.end)-new Date(entry.start))/(1000*3600*24)) + 1
    : '&mdash;';
  return `
    <div class="voucher">
      <div class="v-topbar">
        <span class="v-tag">CONTRACT</span>
        <div class="v-boxes">
          <div class="v-box">Voucher No.<b>&nbsp;</b></div>
          <div class="v-box">Code<b>&nbsp;</b></div>
        </div>
      </div>
      <div class="v-head">UTENGULE ESTATES TZ LTD</div>
      <div class="v-row"><div class="k">Contractor's Name</div><div class="v">${contractor || '&mdash;'}</div></div>
      <div class="v-row"><div class="k">Farm</div><div class="v">UT &ndash; ITIMBA</div></div>
      <div class="v-row"><div class="k">Plot Place</div><div class="v">${entry.plots.join('; ') || '&mdash;'}</div></div>
      <div class="v-work">WORK TO BE DONE: ${entry.task.toUpperCase()}</div>
      <div class="v-row-2">
        <div><span class="k">Starting Date</span><span class="v">${entry.start || '&mdash;'}</span></div>
        <div><span class="k">Finishing Date</span><span class="v">${entry.end || '&mdash;'}</span></div>
      </div>
      <div class="v-row-2">
        <div><span class="k">Agreed Rate</span><span class="v">${entry.rateLabel}</span></div>
        <div><span class="k">TSH (Total)</span><span class="v">${fmt(entry.amt)}</span></div>
      </div>
      <div class="v-row"><div class="k">Signature Contractor</div><div class="v">&nbsp;</div></div>
      <div class="v-row-2">
        <div><span class="k">Estimated Days</span><span class="v">${estDays}</span></div>
        <div><span class="k">Effective Mandays</span><span class="v">${entry.mandays}</span></div>
      </div>
      <div class="v-receipt">
        <div class="v-receipt-title">Payment Received Contractor</div>
        <div class="v-approve">FOR UTENGULE ESTATES TZ LTD</div>
        <div class="v-row-2">
          <div><span class="k">Signature</span><span class="v">&nbsp;</span></div>
          <div><span class="k">Approved By</span><span class="v">&nbsp;</span></div>
        </div>
      </div>
    </div>`;
}

function renderVoucher(){
  const start = state.rangeStart, end = state.rangeEnd;
  const breakdown = taskBreakdown(start, end);
  if(!state.voucherTask || !breakdown.some(b=>b.task===state.voucherTask)){
    state.voucherTask = breakdown.length ? breakdown[0].task : '';
  }
  const entry = breakdown.find(b=>b.task===state.voucherTask);

  return `
  <div class="panel">
    <h2>Contract / Payment Voucher</h2>
    <div class="hint">Built directly from the Task &amp; Plot Breakdown for the period below &mdash; pick a task to see its plots, mandays and total, laid out like the printed "UTENGULE ESTATES TZ L" contract slips.</div>
    ${rangeControls('v')}
    <div class="toolbar">
      <label>Task
        <select id="v-task">
          ${breakdown.map(b=>`<option value="${b.task}" ${state.voucherTask===b.task?'selected':''}>${b.task}</option>`).join('') || '<option value="">No tasks in this period</option>'}
        </select>
      </label>
      <button class="secondary no-print" id="btn-print-voucher">Print This Contract</button>
      <button class="primary no-print" id="btn-print-all" style="margin-left:auto;">Print All Contract Receipts</button>
    </div>
    <div class="hint no-print">"Print All Contract Receipts" prints one slip per task in this period (${breakdown.length} on file), all under Contractor's Name: <b>${state.voucherContractor}</b>.</div>

    <div class="v-row" style="max-width:560px;margin:0 auto 14px;border:1px solid var(--line);border-radius:6px;">
      <div class="k">Contractor's Name</div>
      <div class="v"><input class="field-input" id="v-contractor" value="${state.voucherContractor.replace(/"/g,'&quot;')}" placeholder="Enter contractor name"></div>
    </div>

    ${entry ? voucherBlockHTML(entry, state.voucherContractor) : `<div class="empty-state">No entries in this date range.</div>`}
  </div>
  `;
}

function printAllVouchers(){
  const contractor = state.voucherContractor || 'Osfai Njenda';
  const breakdown = taskBreakdown(state.rangeStart, state.rangeEnd);
  // group 3 receipts per printed A4 sheet
  const sheets = [];
  for(let i=0; i<breakdown.length; i+=3){
    sheets.push(breakdown.slice(i, i+3));
  }
  const blocks = sheets.map(group =>
    `<div class="print-sheet">${group.map(entry=>voucherBlockHTML(entry, contractor)).join('')}</div>`
  ).join('');

  let container = document.getElementById('print-all-vouchers');
  if(!container){
    container = document.createElement('div');
    container.id = 'print-all-vouchers';
    document.body.appendChild(container);
  }
  container.innerHTML = blocks;
  document.body.classList.add('printing-all');
  window.print();
  const cleanup = ()=>{
    document.body.classList.remove('printing-all');
    window.removeEventListener('afterprint', cleanup);
  };
  window.addEventListener('afterprint', cleanup);
}

// ---------- wiring ----------
function wireTab(){
  if(state.tab==='register'){
    const dateEl = document.getElementById('f-date');
    const taskEl = document.getElementById('f-task');
    wireMs('workers'); wireMs('plots');

    const scanToggle = document.getElementById('btn-scan-toggle');
    const scanPanel = document.getElementById('scan-panel');
    scanToggle.onclick = ()=>{
      const open = !scanPanel.classList.contains('open');
      scanPanel.classList.toggle('open', open);
      if(open) startScan(); else stopScan();
    };
    document.getElementById('scan-instant').onchange = e=>{ state.scanInstant = e.target.checked; };
    refreshScanLog();
    document.getElementById('scan-manual').onkeydown = e=>{
      if(e.key==='Enter'){
        e.preventDefault();
        const v = e.target.value; e.target.value = '';
        scanFeedback(handleScan(v));
      }
    };

    dateEl.onchange = e=>{ state.form.date = e.target.value; render(); };
    taskEl.oninput = e=> state.form.task = e.target.value;
    document.querySelectorAll('#f-salary input').forEach(inp=>{
      inp.onchange = ()=>{ state.form.salary = Number(inp.value); render(); };
    });
    document.getElementById('btn-clear').onclick = ()=>{
      state.form = { workers:[], workerInput:'', date: todayISO(), salary: 6000, task:'', plots:[] };
      state.plotFilter = ''; state.msSearch = {workers:'',plots:''};
      render();
    };
    document.getElementById('btn-submit').onclick = async ()=>{
      const f = state.form;
      const msg = document.getElementById('form-msg');
      const workers = f.workers.slice();

      if(!workers.length || !f.date || !f.task.trim() || !f.plots.length){
        msg.innerHTML = `<div class="msg err">Please add at least one worker, and fill in Date, Task and at least one Plot.</div>`;
        return;
      }
      const plotsStr = f.plots.join(', ');
      const maxId = records.reduce((m,r)=>Math.max(m,r.id||0),0);
      const newRecs = workers.map((wid,i)=>({
        id: maxId + i + 1,
        wid, name: (workerById(wid)||{name:wid}).name, date: f.date, day: dayName(f.date),
        salary: Number(f.salary), task: f.task.trim(), plots: plotsStr,
      }));
      records.push(...newRecs);
      await saveRecords();
      state.form = { workers:[], workerInput:'', date: f.date, salary: f.salary, task:'', plots:[] };
      state.plotFilter = ''; state.msSearch = {workers:'',plots:''};
      render();
      const addedNote = '';
      document.getElementById('form-msg').innerHTML = `<div class="msg ok">Saved &ndash; ${newRecs.length} worker(s) logged for "${newRecs[0].task}" on ${newRecs[0].date} (${fmt(Number(f.salary)*newRecs.length)} TZS total).${addedNote}</div>`;
    };
  }
  if(state.tab==='log'){
    document.getElementById('log-month-sel').onchange = e=> setState({logMonth: e.target.value});
    document.getElementById('log-search').oninput = e=> setState({logSearch: e.target.value});
    document.getElementById('btn-export-log').onclick = ()=>{
      const rows = [['Date','Day','ID','Name','Task','Plots','Salary']];
      records.forEach(r=> rows.push([r.date, r.day||dayName(r.date), r.wid||'', r.name, r.task, r.plots, r.salary]));
      downloadCsv('utengule-itimba-labor-log.csv', rows);
    };
    document.querySelectorAll('[data-del]').forEach(btn=>{
      btn.onclick = async ()=>{
        const id = Number(btn.dataset.del);
        records = records.filter(r=>r.id!==id);
        await saveRecords();
        render();
      };
    });
    document.getElementById('btn-export-backup').onclick = exportBackup;
    document.getElementById('btn-import-backup').onchange = async (e)=>{
      const file = e.target.files[0];
      const msgEl = document.getElementById('import-msg');
      if(!file) return;
      try{
        const {added, addedWorkers} = await importBackupFile(file);
        msgEl.className = 'msg ok';
        msgEl.textContent = `Imported: ${added} new entr${added===1?'y':'ies'}${addedWorkers? `, ${addedWorkers} new worker(s) added`:''}.`;
        render();
      }catch(err){
        msgEl.className = 'msg err';
        msgEl.textContent = 'Could not read that backup file.';
      }
    };
  }
  if(state.tab==='badges'){
    wireNewWorker();
    document.getElementById('badge-scope').onchange = e=> setState({badgeScope:e.target.value});
    document.getElementById('badge-format').onchange = e=> setState({badgeFormat:e.target.value});
    const bs = document.getElementById('badge-search');
    bs.oninput = e=>{ state.badgeSearch = e.target.value; const pos = e.target.selectionStart; render(); const n = document.getElementById('badge-search'); n.focus(); n.setSelectionRange(pos,pos); };
    document.getElementById('btn-print-badges').onclick = printBadges;
  }
  if(state.tab==='monthly'){
    wireRangeControls('sum');
    document.getElementById('btn-print-monthly').onclick = ()=> window.print();
  }
  if(state.tab==='tasks'){
    wireRangeControls('task');
    document.getElementById('btn-print-tasks').onclick = ()=> window.print();
  }
  if(state.tab==='voucher'){
    wireRangeControls('v');
    document.getElementById('v-task').onchange = e=> setState({voucherTask: e.target.value});
    document.getElementById('v-contractor').oninput = e=> state.voucherContractor = e.target.value;
    document.getElementById('btn-print-voucher').onclick = ()=> window.print();
    document.getElementById('btn-print-all').onclick = ()=> printAllVouchers();
  }
}

// ---------- boot ----------
(async function(){
  app.innerHTML = `<div class="empty-state"><div class="big">☕</div>Loading labor register&hellip;</div>`;
  await loadRecords();
  await loadExtraWorkers();
  render();
})();


</script>
